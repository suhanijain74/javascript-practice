<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div id="container">

        <div id="startscreen" class="screen active" >
        <h1>Quiz Time!</h1>
        <p>Test your knowledge with these fun questions</p>
        <button id="startbtn">Start Quiz</button>
        </div>


        <div id="quizscreen" class="screen " >
        <h2 id="questext">What is the capital of India?</h2>

        <div id="quizinfo">
            <p>Question <span id="questionumber">1</span> of <span>5</span></p>
            <p>Score: <span id="score">0</span> </p>
        </div>

        <div class="options">
            <button id="option1" class="optionbtn">jaipur</button>
            <button id="option2" class="optionbtn">paris</button>
            <button id="option3" class="optionbtn">new delhi</button>
            <button id="option4" class="optionbtn">panaji</button>
        </div>
        
        <div id="progress-container">
            <div id="progressbar"></div>
        </div>
        </div>

        <div id="resultscreen" class="screen" >
        <h1>Quiz Results</h1>
        <p>You scored <span id=finalscore>0</span> out of <span id="maxscore">5</span></p>
        <button id="restartbtn">Restart Quiz</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
